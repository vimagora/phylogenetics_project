# family.conf: settings of one gene family, read by the generic family scripts
# (search_family.sbatch, summarize_family.py, build_family_fasta.py, align_family.sbatch,
# family_tree.sbatch, make_family_itol.py). KEY=value lines, readable by bash and Python.

NAME="sugar transporters"
# Pfam HMMs that define the family (space-separated); each is downloaded from InterPro
HMMS="PF00083"
# A protein belongs to the family when the domains of one HMM cover at least this share of it,
# at the HMM's gathering threshold. No score filter beyond that, to keep unusual members.
MIN_HMM_COVERAGE=0.5
# Portals whose proteins get a tick in the figure, one colour each (optional, space-separated, up to 4;
# make_family_figure.py --mark overrides them)
MARK_PORTALS="Dicsqu464_2 Aspni_NRRL3_1"
# Results of the family scripts
OUT_DIR=09_families/sugar_transporters
